name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 用官方 Action 安装 Chrome，保证最新稳定版
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    # 关键：安装依赖并获取 Chrome 版本，直接修改脚本让它使用对应版本
    - name: 安装依赖并修复脚本版本匹配
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade undetected-chromedriver selenium

        # 获取当前 Chrome 主版本号（比如 147）
        CHROME_MAJOR=$(google-chrome --version | grep -oE "[0-9]+" | head -n1)
        echo "Chrome major version: $CHROME_MAJOR"

        # 强制修改脚本：删除写死的 version_main=138，改为自动使用当前版本
        sed -i "s/version_main=[0-9]*/version_main=$CHROME_MAJOR/g" bingZDH.py
        sed -i "s/, version_main=[0-9]*//g" bingZDH.py

    - name: 创建配置目录
      run: mkdir -p config

    - name: 写入账号配置
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json

    - name: 运行 Bing 自动化
      run: |
        python bingZDH.py --once

    - name: 上传日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
