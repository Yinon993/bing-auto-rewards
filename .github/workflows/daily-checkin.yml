name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1
      DISPLAY: :99
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装 Chrome（强制清理旧文件 + 修复所有 gpg 错误）
      run: |
        # 关键：强制清理旧文件，避免 File exists 冲突
        sudo rm -f /usr/share/keyrings/google-chrome.gpg
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list

        # 安装依赖
        sudo apt-get update
        sudo apt-get install -y curl gnupg2 ca-certificates unzip

        # 导入密钥（双重保险，避免下载失败）
        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --no-tty --dearmor -o /usr/share/keyrings/google-chrome.gpg || true

        # 添加源
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list

        # 安装 Chrome
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: 修复脚本硬编码版本号
      run: |
        sed -i 's/, version_main=138//g' bingZDH.py
        sed -i 's/version_main=138//g' bingZDH.py

    - name: 安装所有依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade selenium undetected-chromedriver

    - name: 创建配置目录
      run: mkdir -p config

    - name: 写入账号配置
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json

    - name: 运行 Bing 自动化
      run: |
        python bingZDH.py --once

    - name: 上传日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
