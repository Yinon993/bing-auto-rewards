name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1
      DISPLAY: :99
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 强制安装 Chrome 148（和驱动版本完全匹配）
      run: |
        # 清理旧文件
        sudo rm -f /usr/share/keyrings/google-chrome.gpg
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo rm -rf /home/runner/.local/share/undetected_chromedriver

        # 安装依赖
        sudo apt-get update
        sudo apt-get install -y curl gnupg2 ca-certificates unzip

        # 导入密钥
        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --no-tty --dearmor -o /usr/share/keyrings/google-chrome.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list

        # 强制安装 Chrome 148 版本
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable=148.0.7603.61-1

    - name: 修复脚本里的硬编码版本号
      run: |
        sed -i 's/, version_main=138//g' bingZDH.py
        sed -i 's/version_main=138//g' bingZDH.py

    - name: 安装依赖并锁定 undetected-chromedriver 版本
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install undetected-chromedriver==3.5.5 selenium==4.15.2

    - name: 创建配置目录
      run: mkdir -p config

    - name: 写入账号配置
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json

    - name: 运行 Bing 自动化
      run: |
        python bingZDH.py --once

    - name: 上传日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
