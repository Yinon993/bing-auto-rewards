name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1
      DISPLAY: :99
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Chrome and ChromeDriver (终极修复版)
      run: |
        sudo rm -f /usr/share/keyrings/google-chrome.gpg
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list

        sudo apt-get update
        sudo apt-get install -y curl gnupg2 ca-certificates

        curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --no-tty --dearmor -o /usr/share/keyrings/google-chrome.gpg || \
        curl -fsSL https://www.google.com/linuxrepositories/apt.html | grep -A 20 "Linux Package Signing Key" | grep "-----BEGIN PGP PUBLIC KEY BLOCK-----" -A 100 | sudo gpg --batch --no-tty --dearmor -o /usr/share/keyrings/google-chrome.gpg

        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list

        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        pip install selenium webdriver-manager
        python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"
        sudo ln -sf $(python -c "from webdriver_manager.chrome import ChromeDriverManager; print(ChromeDriverManager().install())") /usr/local/bin/chromedriver
        chmod +x /usr/local/bin/chromedriver
        
    - name: Verify Chrome and ChromeDriver
      run: |
        google-chrome --version
        which google-chrome
        chromedriver --version
        which chromedriver
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create config directory
      run: mkdir -p config
      
    - name: Setup accounts configuration
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json
        
    - name: Run Bing automation
      run: |
        python bingZDH.py --once
        
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
