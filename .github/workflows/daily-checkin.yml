name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1
      DISPLAY: :99
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖 + Chrome（二进制包，无 apt 问题）
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget unzip xvfb libxi6 libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libatspi2.0-0

        # 下载 Chrome 稳定版二进制包
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy

        # 下载匹配的 ChromeDriver
        CHROME_VERSION=$(google-chrome --version | cut -d ' ' -f3 | cut -d '.' -f1)
        echo "Chrome major version: $CHROME_VERSION"
        wget -O chromedriver.zip https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION
        CHROMEDRIVER_VERSION=$(cat chromedriver.zip)
        wget -O chromedriver_linux64.zip https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        rm -rf chromedriver*.zip google-chrome-stable_current_amd64.deb

    - name: 强制修改脚本，不用 undetected-chromedriver，改用原生 selenium
      run: |
        # 备份原脚本
        cp bingZDH.py bingZDH.py.bak
        
        # 替换所有 uc.Chrome 调用为原生 selenium，同时删除写死的 version_main
        sed -i 's/import undetected_chromedriver as uc//g' bingZDH.py
        sed -i 's/uc\.Chrome/webdriver\.Chrome/g' bingZDH.py
        sed -i 's/, version_main=[0-9]*//g' bingZDH.py

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install selenium

    - name: 创建配置目录
      run: mkdir -p config

    - name: 写入账号配置
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json

    - name: 运行 Bing 自动化
      run: |
        python bingZDH.py --once

    - name: 上传日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
