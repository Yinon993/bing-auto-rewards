name: Bing Daily Check-in

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  bing-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 直接用官方 Chrome Action，自动搞定所有依赖和版本匹配
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: 修复脚本硬编码版本号
      run: |
        sed -i 's/, version_main=138//g' bingZDH.py
        sed -i 's/version_main=138//g' bingZDH.py

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade undetected-chromedriver selenium

    - name: 创建配置目录
      run: mkdir -p config

    - name: 写入账号配置
      run: |
        echo '${{ secrets.ACCOUNTS_CONFIG }}' > config/accounts.json

    - name: 运行 Bing 自动化
      run: |
        python bingZDH.py --once

    - name: 上传日志
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bing-logs
        path: |
          *.log
          *.png
        retention-days: 7
